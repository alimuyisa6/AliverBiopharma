plugins {
    id "com.android.application"
}

android {
    namespace "com.aliverbiopharma.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.aliverbiopharma.app"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

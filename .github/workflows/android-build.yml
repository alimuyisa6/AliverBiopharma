name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build unsigned release APK
        working-directory: android
        run: gradle assembleRelease

      - name: Align and sign release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          KEYSTORE="$RUNNER_TEMP/aliverbiopharma-release.jks"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          FINAL="app/build/outputs/apk/release/AliverBiopharm-1.0.3.apk"

          keytool -genkeypair -v             -keystore "$KEYSTORE"             -storepass android             -keypass android             -alias aliverbiopharma             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=AliverBiopharm, OU=Development, O=AliverBiopharm, L=Kampala, ST=Central, C=UG"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign             --ks "$KEYSTORE"             --ks-pass pass:android             --key-pass pass:android             --ks-key-alias aliverbiopharma             --out "$FINAL"             "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$FINAL"

      - name: Build release AAB
        working-directory: android
        run: gradle bundleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aliverbiopharma-1.0.3
          path: |
            android/app/build/outputs/apk/release/AliverBiopharm-1.0.3.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
